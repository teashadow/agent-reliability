[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkwell"
version = "0.1.0"
description = "MAD disclosure template generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.0",
  "rich>=13.0",
]

[project.scripts]
inkwell = "dt.cli:main"
dt = "dt.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
dt = ["templates/**/*.md"]
