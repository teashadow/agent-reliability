[project]
name = "escalate"
version = "0.1.0"
description = "Multi-turn resilience prober for your own LLM endpoints (MAD battery)"
requires-python = ">=3.11"
dependencies = ["click>=8", "rich>=13", "requests>=2"]

[project.scripts]
escalate = "escalate_app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["escalate_app*"]
