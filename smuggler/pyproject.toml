[project]
name = "smuggler"
version = "2.0.0"
description = "Unicode/obfuscation filter-bypass panel for your own agent filters (MAD battery)"
requires-python = ">=3.11"
dependencies = ["click>=8", "rich>=13", "httpx>=0.27"]

[project.scripts]
smuggler = "smuggler_app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smuggler_app*"]
