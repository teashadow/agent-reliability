[project]
name = "spike"
version = "2.0.0"
description = "Single-shot prompt-injection battery for your own LLM endpoints (MAD battery)"
requires-python = ">=3.11"
dependencies = ["click>=8", "rich>=13", "httpx>=0.27"]

[project.scripts]
spike = "spike_app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spike_app*"]
